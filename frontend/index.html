<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AzureLaunch</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 2.5rem 3rem;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #58a6ff;
      border: 1px solid #58a6ff;
      border-radius: 20px;
      padding: 0.25rem 0.75rem;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #58a6ff, #bc8cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p { color: #8b949e; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .btn {
      background: transparent;
      border: 1px solid #58a6ff;
      color: #58a6ff;
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.15s, color 0.15s;
      margin-bottom: 1rem;
    }
    .btn:hover { background: #58a6ff; color: #0d1117; }
    .response {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.8rem;
      color: #3fb950;
      text-align: left;
      display: none;
      white-space: pre-wrap;
    }
    .response.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">FastAPI + Azure ACR</div>
    <h1>AzureLaunch 🚀</h1>
    <p>Python FastAPI · GitHub Actions · Azure Container Registry</p>
    <button class="btn" onclick="ping()">Ping AzureLaunch API</button>
    <div class="response" id="res"></div>
  </div>

  <script>
    const BACKEND = window.BACKEND_URL || 'https://azurelaunch-backend.kindriver-e93cab17.eastus.azurecontainerapps.io';
    async function ping() {
      const el = document.getElementById('res');
      el.classList.add('show');
      el.textContent = 'Calling AzureLaunch API...';
      try {
        const r = await fetch(`${BACKEND}/`);
        const d = await r.json();
        el.textContent = JSON.stringify(d, null, 2);
      } catch(e) {
        el.textContent = `Error: ${e.message}`;
      }
    }
  </script>
</body>
</html>
