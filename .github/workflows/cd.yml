name: CD — Push to ACR & Deploy to Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  RESOURCE_GROUP: azurelaunch-rg
  BACKEND_APP: azurelaunch-backend
  FRONTEND_APP: azurelaunch-frontend
  CONTAINER_ENV: azurelaunch-env

jobs:
  # ── JOB 1: Build & Push to ACR ──────────────────────────
  push-to-acr:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.3.0

      - name: Set image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login to Azure
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build & push backend
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_APP }}:${{ github.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_APP }}:latest \
            ./backend
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_APP }}:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_APP }}:latest

      - name: Build & push frontend
        run: |
          docker build \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_APP }}:${{ github.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_APP }}:latest \
            ./frontend
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_APP }}:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_APP }}:latest

  # ── JOB 2: Deploy to Container Apps ─────────────────────
  deploy:
    name: Deploy to Container Apps
    runs-on: ubuntu-latest
    needs: push-to-acr
    outputs:
      backend_url: ${{ steps.get-urls.outputs.backend_url }}
      frontend_url: ${{ steps.get-urls.outputs.frontend_url }}

    steps:
      - name: Login to Azure
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Deploy backend
        run: |
          az containerapp update \
            --name ${{ env.BACKEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_APP }}:${{ needs.push-to-acr.outputs.image_tag }}

      - name: Deploy frontend
        run: |
          az containerapp update \
            --name ${{ env.FRONTEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_APP }}:${{ needs.push-to-acr.outputs.image_tag }}

      - name: Get live URLs
        id: get-urls
        run: |
          BACKEND_URL=$(az containerapp show \
            --name ${{ env.BACKEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn --output tsv)
          FRONTEND_URL=$(az containerapp show \
            --name ${{ env.FRONTEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn --output tsv)
          echo "backend_url=https://$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "frontend_url=https://$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          echo "✅ Backend  → https://$BACKEND_URL"
          echo "✅ Frontend → https://$FRONTEND_URL"

  # ── JOB 3: Smoke Test Live URLs ─────────────────────────
  smoke-test:
    name: Smoke Test Live Deployment
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for deployment to stabilise
        run: sleep 20

      - name: Smoke test — backend /health
        run: |
          URL="${{ needs.deploy.outputs.backend_url }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
          echo "Backend /health → HTTP $STATUS  ($URL/health)"
          [ "$STATUS" = "200" ] || (echo "❌ Backend health failed" && exit 1)
          echo "✅ Backend healthy"

      - name: Smoke test — backend /
        run: |
          URL="${{ needs.deploy.outputs.backend_url }}"
          RESPONSE=$(curl -s "$URL/")
          echo "Backend / → $RESPONSE"
          echo "$RESPONSE" | grep -q "Hello" || (echo "❌ Root response invalid" && exit 1)
          echo "✅ Backend root OK"

      - name: Smoke test — backend /version
        run: |
          URL="${{ needs.deploy.outputs.backend_url }}"
          RESPONSE=$(curl -s "$URL/version")
          echo "Backend /version → $RESPONSE"
          echo "$RESPONSE" | grep -q "azurelaunch" || (echo "❌ Version response invalid" && exit 1)
          echo "✅ Version OK"

      - name: Smoke test — frontend /health
        run: |
          URL="${{ needs.deploy.outputs.frontend_url }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
          echo "Frontend /health → HTTP $STATUS  ($URL/health)"
          [ "$STATUS" = "200" ] || (echo "❌ Frontend health failed" && exit 1)
          echo "✅ Frontend healthy"

      - name: Print live URLs
        run: |
          echo "════════════════════════════════════════"
          echo "🚀 AzureLaunch is live!"
          echo "  Backend  → ${{ needs.deploy.outputs.backend_url }}"
          echo "  Frontend → ${{ needs.deploy.outputs.frontend_url }}"
          echo "════════════════════════════════════════"