name: CI — Build & Smoke Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.3.0

      # ── Build backend ──────────────────────────
      - name: Build backend Docker image
        run: docker build -t azurelaunch-backend:ci ./backend

      - name: Run backend container
        run: docker run -d --name backend -p 8000:8000 azurelaunch-backend:ci

      - name: Wait for backend to start
        run: |
          echo "Waiting for backend..."
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && echo "Backend is up!" && break
            sleep 3
          done

      - name: Smoke test — GET /
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/)
          echo "GET / → HTTP $STATUS"
          [ "$STATUS" = "200" ] || (echo "❌ Root endpoint failed" && exit 1)
          echo "✅ Root OK"

      - name: Smoke test — GET /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          echo "GET /health → HTTP $STATUS"
          [ "$STATUS" = "200" ] || (echo "❌ Health check failed" && exit 1)
          echo "✅ Health OK"

      - name: Smoke test — GET /version
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/version)
          echo "GET /version → HTTP $STATUS"
          [ "$STATUS" = "200" ] || (echo "❌ Version endpoint failed" && exit 1)
          echo "✅ Version OK"

      - name: Show backend logs if failed
        if: failure()
        run: docker logs backend || true

      - name: Cleanup backend
        if: always()
        run: docker rm -f backend || true

      # ── Build frontend ─────────────────────────
      - name: Build frontend Docker image
        run: docker build -t azurelaunch-frontend:ci ./frontend

      - name: Run frontend container
        run: docker run -d --name frontend -p 8080:80 azurelaunch-frontend:ci

      - name: Wait for frontend to start
        run: |
          echo "Waiting for frontend..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && echo "Frontend is up!" && break
            sleep 2
          done

      - name: Smoke test — frontend /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          echo "Frontend /health → HTTP $STATUS"
          [ "$STATUS" = "200" ] || (echo "❌ Frontend health failed" && exit 1)
          echo "✅ Frontend OK"

      - name: Show frontend logs if failed
        if: failure()
        run: docker logs frontend || true

      - name: Cleanup frontend
        if: always()
        run: docker rm -f frontend || true