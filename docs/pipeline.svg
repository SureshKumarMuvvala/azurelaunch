<svg width="680" height="580" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    @keyframes travel { 0%{stroke-dashoffset:120} 100%{stroke-dashoffset:0} }
    @keyframes travel-lng { 0%{stroke-dashoffset:200} 100%{stroke-dashoffset:0} }
    @keyframes ripple { 0%{r:6;opacity:.6} 100%{r:22;opacity:0} }
    @keyframes spin-slow { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes float-up { 0%{transform:translateY(0);opacity:.8} 100%{transform:translateY(-20px);opacity:0} }

    .pipe        { stroke-dasharray:6 4; fill:none; stroke-width:1.8; }
    .p-short     { animation: travel 1.1s linear infinite; }
    .p-long      { animation: travel-lng 1.9s linear infinite; }
    .dot-pulse   { animation: pulse 1.3s ease-in-out infinite; }
    .dot-ripple  { animation: ripple 1.4s ease-out infinite; fill:none; stroke-width:1.2; }
    .acr-spin    { transform-origin:340px 482px; animation:spin-slow 7s linear infinite; }
    .cursor      { animation: blink .9s step-end infinite; }
    .pkt         { animation: float-up 1.8s ease-in infinite; }
  </style>

  <!-- background -->
  <rect width="680" height="580" fill="#0d1117" rx="12"/>

  <!-- title -->
  <text x="340" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3" font-family="system-ui,sans-serif">AzureLaunch — CI/CD Pipeline</text>

  <!-- defs -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- LOCAL DEV terminal -->
  <rect x="60" y="36" width="222" height="90" rx="10" fill="#0d2b1a" stroke="#1D9E75" stroke-width="1"/>
  <rect x="60" y="36" width="222" height="22" rx="10" fill="#0F6E56"/>
  <rect x="60" y="47" width="222" height="11" fill="#0F6E56"/>
  <circle cx="78"  cy="47" r="4" fill="#f85149"/>
  <circle cx="92"  cy="47" r="4" fill="#EF9F27"/>
  <circle cx="106" cy="47" r="4" fill="#3fb950"/>
  <text x="76" y="76"  font-family="monospace" font-size="10" fill="#5DCAA5">$ uv init --no-vcs</text>
  <text x="76" y="90"  font-family="monospace" font-size="10" fill="#5DCAA5">$ uv add fastapi uvicorn</text>
  <text x="76" y="104" font-family="monospace" font-size="10" fill="#5DCAA5">$ git push origin main<tspan class="cursor" fill="#3fb950">_</tspan></text>
  <text x="170" y="138" text-anchor="middle" font-size="11" fill="#8b949e" font-family="system-ui,sans-serif">local dev  ·  step 0–1</text>

  <!-- push arrow -->
  <line x1="170" y1="126" x2="170" y2="166" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr)"/>
  <path class="pipe p-short" d="M170 126 L170 166" stroke="#1D9E75"/>

  <!-- GITHUB REPO -->
  <rect x="60" y="166" width="222" height="58" rx="10" fill="#161b22" stroke="#534AB7" stroke-width="1"/>
  <circle cx="90" cy="195" r="16" fill="#1a1340"/>
  <text x="90" y="201" text-anchor="middle" font-size="16" fill="#AFA9EC" font-family="system-ui,sans-serif">⚙</text>
  <text x="116" y="190" font-size="12" font-weight="600" fill="#CECBF6" font-family="system-ui,sans-serif">azurelaunch</text>
  <text x="116" y="205" font-size="10" fill="#7F77DD" font-family="system-ui,sans-serif">main  ·  on: push  ·  triggers CI + CD</text>
  <text x="170" y="236" text-anchor="middle" font-size="11" fill="#8b949e" font-family="system-ui,sans-serif">github repo  ·  step 2–3</text>

  <!-- split -->
  <line x1="170" y1="224" x2="170" y2="250" stroke="#30363d" stroke-width="1"/>
  <line x1="82"  y1="250" x2="598" y2="250" stroke="#30363d" stroke-width="1"/>
  <line x1="82"  y1="250" x2="82"  y2="274" stroke="#EF9F27" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="598" y1="250" x2="598" y2="274" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arr)"/>
  <path class="pipe p-short" d="M170 224 L170 250 L82 250 L82 274"  stroke="#EF9F27"/>
  <path class="pipe p-long"  d="M170 224 L170 250 L598 250 L598 274" stroke="#378ADD"/>

  <!-- CI WORKFLOW -->
  <rect x="26" y="274" width="212" height="120" rx="10" fill="#161108" stroke="#854F0B" stroke-width="1"/>
  <text x="132" y="294" text-anchor="middle" font-size="12" font-weight="600" fill="#FAC775" font-family="system-ui,sans-serif">CI  ·  ci.yml</text>
  <rect x="38" y="302" width="188" height="21" rx="5" fill="#2a1e06"/>
  <circle cx="51" cy="312" r="4" fill="#EF9F27" class="dot-pulse"/>
  <text x="62" y="316" font-size="10" fill="#FAC775" font-family="system-ui,sans-serif">docker build backend + frontend</text>
  <rect x="38" y="327" width="188" height="21" rx="5" fill="#2a1e06"/>
  <circle cx="51" cy="337" r="4" fill="#EF9F27" class="dot-pulse" style="animation-delay:.35s"/>
  <text x="62" y="341" font-size="10" fill="#FAC775" font-family="system-ui,sans-serif">smoke test  /  /health  /version</text>
  <rect x="38" y="352" width="188" height="21" rx="5" fill="#0d2a10"/>
  <circle cx="51" cy="362" r="4" fill="#3fb950"/>
  <text x="62" y="366" font-size="10" fill="#56d364" font-family="system-ui,sans-serif">PR check  ✓  green  —  no push</text>
  <text x="132" y="408" text-anchor="middle" font-size="11" fill="#8b949e" font-family="system-ui,sans-serif">ci workflow  ·  step 3</text>

  <!-- CD WORKFLOW -->
  <rect x="470" y="274" width="200" height="196" rx="10" fill="#0d1e2e" stroke="#185FA5" stroke-width="1"/>
  <text x="570" y="294" text-anchor="middle" font-size="12" font-weight="600" fill="#85B7EB" font-family="system-ui,sans-serif">CD  ·  cd.yml</text>
  <rect x="482" y="302" width="176" height="20" rx="5" fill="#0c2440"/>
  <circle cx="495" cy="312" r="4" fill="#378ADD" class="dot-pulse" style="animation-delay:.1s"/>
  <text x="506" y="316" font-size="10" fill="#85B7EB" font-family="system-ui,sans-serif">docker build + push to ACR</text>
  <rect x="482" y="326" width="176" height="20" rx="5" fill="#0c2440"/>
  <circle cx="495" cy="336" r="4" fill="#378ADD" class="dot-pulse" style="animation-delay:.4s"/>
  <text x="506" y="340" font-size="10" fill="#85B7EB" font-family="system-ui,sans-serif">az login  (OIDC · no secrets)</text>
  <rect x="482" y="350" width="176" height="20" rx="5" fill="#0c2440"/>
  <circle cx="495" cy="360" r="4" fill="#378ADD" class="dot-pulse" style="animation-delay:.7s"/>
  <text x="506" y="364" font-size="10" fill="#85B7EB" font-family="system-ui,sans-serif">az containerapp update</text>
  <rect x="482" y="374" width="176" height="20" rx="5" fill="#0d2a10"/>
  <circle cx="495" cy="384" r="4" fill="#3fb950"/>
  <text x="506" y="388" font-size="10" fill="#56d364" font-family="system-ui,sans-serif">smoke test prod  ✓</text>
  <rect x="482" y="398" width="176" height="20" rx="5" fill="#0d2a10"/>
  <circle cx="495" cy="408" r="4" fill="#3fb950"/>
  <text x="506" y="412" font-size="10" fill="#56d364" font-family="system-ui,sans-serif">deploy complete  ✓</text>
  <rect x="482" y="422" width="176" height="14" rx="5" fill="#0d2a10" opacity=".5"/>
  <text x="506" y="432" font-size="9" fill="#3fb950" opacity=".7" font-family="system-ui,sans-serif">↻ runs on every merge to main</text>
  <text x="570" y="484" text-anchor="middle" font-size="11" fill="#8b949e" font-family="system-ui,sans-serif">cd workflow  ·  step 4</text>

  <!-- CD to ACR arrow -->
  <path d="M570 470 L570 508 L418 508" stroke="#378ADD" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path class="pipe p-long" d="M570 470 L570 508 L418 508" stroke="#378ADD"/>

  <!-- floating packets -->
  <circle cx="432" cy="500" r="3"   fill="#378ADD" class="pkt" style="animation-delay:0s"/>
  <circle cx="452" cy="500" r="2.5" fill="#85B7EB" class="pkt" style="animation-delay:.65s"/>
  <circle cx="412" cy="500" r="2"   fill="#378ADD" class="pkt" style="animation-delay:1.3s"/>

  <!-- ACR -->
  <rect x="194" y="484" width="224" height="80" rx="10" fill="#0d1e2e" stroke="#185FA5" stroke-width="1.2"/>
  <g class="acr-spin">
    <circle cx="340" cy="508" r="12" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="18 14"/>
  </g>
  <circle cx="340" cy="508" r="6" fill="#185FA5"/>
  <circle cx="340" cy="508" r="3" fill="#85B7EB"/>
  <circle cx="340" cy="508" class="dot-ripple" stroke="#378ADD" style="animation-delay:0s"/>
  <circle cx="340" cy="508" class="dot-ripple" stroke="#85B7EB" style="animation-delay:.7s"/>
  <text x="362" y="503" font-size="11" font-weight="600" fill="#85B7EB" font-family="system-ui,sans-serif">Azure Container Registry</text>
  <text x="362" y="517" font-size="10" fill="#378ADD" font-family="system-ui,sans-serif">azurelaunchacr10033.azurecr.io</text>
  <text x="362" y="531" font-size="10" fill="#5F5E5A" font-family="system-ui,sans-serif">backend · frontend · :sha · :latest</text>
  <text x="362" y="545" font-size="10" fill="#3fb950" font-family="system-ui,sans-serif">● live · always running</text>
  <text x="306" y="574" text-anchor="middle" font-size="11" fill="#8b949e" font-family="system-ui,sans-serif">azure container registry  ·  step 4</text>
</svg>
