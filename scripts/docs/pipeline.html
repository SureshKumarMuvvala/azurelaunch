<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AzureLaunch CI/CD Pipeline</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; gap: 1rem; }
  h1 { color: #e6edf3; font-size: 1.1rem; font-weight: 500; letter-spacing: .04em; }
  svg { max-width: 680px; width: 100%; }

  @keyframes pulse      { 0%,100%{opacity:1} 50%{opacity:.3} }
  @keyframes travel     { 0%{stroke-dashoffset:120} 100%{stroke-dashoffset:0} }
  @keyframes travel-lng { 0%{stroke-dashoffset:200} 100%{stroke-dashoffset:0} }
  @keyframes ripple     { 0%{r:6;opacity:.6} 100%{r:22;opacity:0} }
  @keyframes spin-slow  { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes blink      { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  @keyframes float-up   { 0%{transform:translateY(0);opacity:.8} 100%{transform:translateY(-20px);opacity:0} }

  .pipe        { stroke-dasharray:6 4; fill:none; stroke-width:1.8; }
  .p-short     { animation: travel 1.1s linear infinite; }
  .p-long      { animation: travel-lng 1.9s linear infinite; }
  .dot-pulse   { animation: pulse 1.3s ease-in-out infinite; }
  .dot-ripple  { animation: ripple 1.4s ease-out infinite; fill:none; stroke-width:1.2; }
  .acr-spin    { transform-origin:340px 482px; animation:spin-slow 7s linear infinite; }
  .cursor      { animation: blink .9s step-end infinite; }
  .pkt         { animation: float-up 1.8s ease-in infinite; }
</style>
</head>
<body>
<h1>AzureLaunch — CI/CD Pipeline</h1>
<svg viewBox="0 0 680 570" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- LOCAL DEV terminal -->
  <rect x="60" y="28" width="222" height="90" rx="10" fill="#0d2b1a" stroke="#1D9E75" stroke-width="1"/>
  <rect x="60" y="28" width="222" height="22" rx="10" fill="#0F6E56"/>
  <rect x="60" y="39"  width="222" height="11" fill="#0F6E56"/>
  <circle cx="78"  cy="39" r="4" fill="#f85149"/>
  <circle cx="92"  cy="39" r="4" fill="#EF9F27"/>
  <circle cx="106" cy="39" r="4" fill="#3fb950"/>
  <text x="76" y="68"  font-family="monospace" font-size="10" fill="#5DCAA5">$ uv init &amp;&amp; uv add fastapi uvicorn</text>
  <text x="76" y="82"  font-family="monospace" font-size="10" fill="#5DCAA5">$ git add . &amp;&amp; git commit -m "feat"</text>
  <text x="76" y="96"  font-family="monospace" font-size="10" fill="#5DCAA5">$ git push origin main<tspan class="cursor" fill="#3fb950">_</tspan></text>
  <text x="170" y="130" text-anchor="middle" font-size="11" fill="#8b949e">local dev  ·  step 0–1</text>

  <line x1="170" y1="118" x2="170" y2="158" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr)"/>
  <path class="pipe p-short" d="M170 118 L170 158" stroke="#1D9E75"/>

  <!-- GITHUB REPO -->
  <rect x="60" y="158" width="222" height="58" rx="10" fill="#161b22" stroke="#534AB7" stroke-width="1"/>
  <circle cx="90" cy="187" r="16" fill="#1a1340"/>
  <text x="90" y="193" text-anchor="middle" font-size="16" fill="#AFA9EC">&#9864;</text>
  <text x="116" y="182" font-size="12" font-weight="600" fill="#CECBF6">azurelaunch</text>
  <text x="116" y="197" font-size="10" fill="#7F77DD">main  ·  on: push  ·  workflows trigger</text>
  <text x="170" y="228" text-anchor="middle" font-size="11" fill="#8b949e">github repo  ·  step 2–3</text>

  <line x1="170" y1="216" x2="170" y2="244" stroke="#30363d" stroke-width="1"/>
  <line x1="80"  y1="244" x2="600" y2="244" stroke="#30363d" stroke-width="1"/>
  <line x1="80"  y1="244" x2="80"  y2="268" stroke="#EF9F27" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="600" y1="244" x2="600" y2="268" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arr)"/>
  <path class="pipe p-short" d="M170 216 L170 244 L80 244 L80 268"  stroke="#EF9F27"/>
  <path class="pipe p-long"  d="M170 216 L170 244 L600 244 L600 268" stroke="#378ADD"/>

  <!-- CI WORKFLOW -->
  <rect x="24"  y="268" width="212" height="120" rx="10" fill="#161108" stroke="#854F0B" stroke-width="1"/>
  <text x="130" y="288" text-anchor="middle" font-size="12" font-weight="600" fill="#FAC775">CI  ·  ci.yml</text>
  <rect x="36" y="296" width="190" height="21" rx="5" fill="#2a1e06"/>
  <circle cx="50" cy="306" r="4" fill="#EF9F27" class="dot-pulse"/>
  <text x="61" y="310" font-size="10" fill="#FAC775">docker build backend + frontend</text>
  <rect x="36" y="321" width="190" height="21" rx="5" fill="#2a1e06"/>
  <circle cx="50" cy="331" r="4" fill="#EF9F27" class="dot-pulse" style="animation-delay:.35s"/>
  <text x="61" y="335" font-size="10" fill="#FAC775">smoke test  /  /health  /version</text>
  <rect x="36" y="346" width="190" height="21" rx="5" fill="#0d2a10"/>
  <circle cx="50" cy="356" r="4" fill="#3fb950"/>
  <text x="61" y="360" font-size="10" fill="#56d364">PR check  ✓  green  —  no push</text>
  <text x="130" y="402" text-anchor="middle" font-size="11" fill="#8b949e">ci workflow  ·  step 3</text>

  <!-- CD WORKFLOW -->
  <rect x="466" y="268" width="200" height="170" rx="10" fill="#0d1e2e" stroke="#185FA5" stroke-width="1"/>
  <text x="566" y="288" text-anchor="middle" font-size="12" font-weight="600" fill="#85B7EB">CD  ·  cd.yml</text>
  <rect x="478" y="296" width="175" height="20" rx="5" fill="#0c2440"/>
  <circle cx="491" cy="306" r="4" fill="#378ADD" class="dot-pulse" style="animation-delay:.1s"/>
  <text x="502" y="310" font-size="10" fill="#85B7EB">docker build backend + frontend</text>
  <rect x="478" y="320" width="175" height="20" rx="5" fill="#0c2440"/>
  <circle cx="491" cy="330" r="4" fill="#378ADD" class="dot-pulse" style="animation-delay:.4s"/>
  <text x="502" y="334" font-size="10" fill="#85B7EB">az login  (OIDC · no secrets)</text>
  <rect x="478" y="344" width="175" height="20" rx="5" fill="#0c2440"/>
  <circle cx="491" cy="354" r="4" fill="#378ADD" class="dot-pulse" style="animation-delay:.7s"/>
  <text x="502" y="358" font-size="10" fill="#85B7EB">docker push  :sha + :latest</text>
  <rect x="478" y="368" width="175" height="20" rx="5" fill="#0d2a10"/>
  <circle cx="491" cy="378" r="4" fill="#3fb950"/>
  <text x="502" y="382" font-size="10" fill="#56d364">smoke test prod  ✓</text>
  <rect x="478" y="392" width="175" height="20" rx="5" fill="#0d2a10"/>
  <circle cx="491" cy="402" r="4" fill="#3fb950"/>
  <text x="502" y="406" font-size="10" fill="#56d364">deploy complete  ✓</text>
  <rect x="478" y="416" width="175" height="14" rx="5" fill="#0d2a10" opacity=".5"/>
  <text x="502" y="426" font-size="9" fill="#3fb950" opacity=".7">&#8635; runs on every merge to main</text>
  <text x="566" y="452" text-anchor="middle" font-size="11" fill="#8b949e">cd workflow  ·  step 4</text>

  <path d="M566 438 L566 482 L418 482" stroke="#378ADD" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path class="pipe p-long" d="M566 438 L566 482 L418 482" stroke="#378ADD"/>

  <!-- floating packets -->
  <circle cx="432" cy="474" r="3"   fill="#378ADD" class="pkt" style="animation-delay:0s"/>
  <circle cx="452" cy="474" r="2.5" fill="#85B7EB" class="pkt" style="animation-delay:.65s"/>
  <circle cx="412" cy="474" r="2"   fill="#378ADD" class="pkt" style="animation-delay:1.3s"/>

  <!-- ACR -->
  <rect x="194" y="458" width="224" height="88" rx="10" fill="#0d1e2e" stroke="#185FA5" stroke-width="1.2"/>
  <g class="acr-spin">
    <circle cx="340" cy="482" r="12" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="18 14"/>
  </g>
  <circle cx="340" cy="482" r="6" fill="#185FA5"/>
  <circle cx="340" cy="482" r="3" fill="#85B7EB"/>
  <circle cx="340" cy="482" class="dot-ripple" stroke="#378ADD" style="animation-delay:0s"/>
  <circle cx="340" cy="482" class="dot-ripple" stroke="#85B7EB" style="animation-delay:.7s"/>
  <text x="362" y="477" font-size="12" font-weight="600" fill="#85B7EB">Azure Container Registry</text>
  <text x="362" y="492" font-size="10" fill="#378ADD">azurelaunchacr.azurecr.io</text>
  <text x="362" y="506" font-size="10" fill="#5F5E5A">backend  ·  frontend  ·  :sha  ·  :latest</text>
  <text x="362" y="520" font-size="10" fill="#3fb950">&#11044; live  ·  images stored  ·  always running</text>
  <text x="306" y="558" text-anchor="middle" font-size="11" fill="#8b949e">azure container registry  ·  step 4</text>
</svg>
</body>
</html>
